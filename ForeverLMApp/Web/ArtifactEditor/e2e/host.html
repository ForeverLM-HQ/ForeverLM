<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The editor as the Mac app hosts it, with a host that keeps every
         message the editor sends (`window.hostMessages`). The tests open it
         with `openEditor` (editor-page.mjs). -->
    <link rel="stylesheet" href="./.build/editor.css">
  </head>
  <body>
    <main id="editor" aria-label="Page editor"></main>
    <script>
      window.hostMessages = []
      window.webkit = {
        messageHandlers: {
          artifactEditor: {
            postMessage(message) {
              const copy = JSON.parse(JSON.stringify(message))
              copy.at = performance.now()
              window.hostMessages.push(copy)
              window.onHostMessage?.(copy)
            },
          },
        },
      }
    </script>
    <script src="./.build/editor.js"></script>
  </body>
</html>
