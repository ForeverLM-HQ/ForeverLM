        PRODUCT_MODULE_NAME: ForeverLMMacUITests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: ""
        TEST_TARGET_NAME: ForeverLM_macOS
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: XXXXXXXXXX

  # iOS UI Tests
  # XCUITest is the only way to drive the iOS app on this machine: Xcode 27
  # ships no Simulator.app and the Claude simulator helper's input path is
  # broken, so taps injected in-process by the test runner are the sole
  # interaction surface.
  ForeverLMiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/iOS
    dependencies:
      - target: ForeverLM_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foreverlm.ios-uitests
        PRODUCT_NAME: ForeverLMiOSUITests
        PRODUCT_MODULE_NAME: ForeverLMiOSUITests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: ForeverLM_iOS
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: XXXXXXXXXX

  # iOS Unit Tests — direct coverage for CloudKit mutation convergence and
  # other phone-only behavior that cannot be exercised by the macOS host.
  ForeverLMiOSUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - iOSUnitTests
      # The in-memory CloudKit the phone's sync suites run on, the same one the Mac's suites use.
      - UnitTests/Support/FakeCloudKit.swift
      - path: ../schema/vectors
        type: folder
        buildPhase: resources
    dependencies:
      - target: ForeverLM_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foreverlm.ios-unittests
        PRODUCT_NAME: ForeverLMiOSUnitTests
        PRODUCT_MODULE_NAME: ForeverLMiOSUnitTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ForeverLM.app/ForeverLM"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: XXXXXXXXXX

  # Auxiliary command-line tool embedded in the macOS app (Contents/MacOS).
  # Mints Apple Podcasts API bearer tokens via the private PodcastsFoundation
  # framework, isolated in its own process so a signing-teardown crash in that
  # framework can never reach the host app. Re-signed on copy with the app's
  # identity, so its own signing config is intentionally minimal.
  PodcastTokenHelper:
    type: tool
    platform: macOS
    sources:
      - PodcastTokenHelper
    settings:
      base:
        PRODUCT_NAME: PodcastTokenHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.foreverlm.podcasttokenhelper
        CLANG_ENABLE_OBJC_ARC: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        SKIP_INSTALL: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XXXXXXXXXX
