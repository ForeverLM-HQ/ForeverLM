        embed: true
      - target: ForeverLMWatch
        embed: true
      - package: WebRTC
    settings:
      base:
        # One App ID with the Developer ID Mac app (company team, 2026-10-09):
        # com.foreverlm.mobile belonged to the old team and can never be reused.
        PRODUCT_BUNDLE_IDENTIFIER: com.foreverlm
        PRODUCT_NAME: "ForeverLM"
        PRODUCT_MODULE_NAME: "ForeverLM"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: iOS/Info.plist
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "49"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The iPhone app shares the Mac app's bundle ID, so it must never install on
        # an Apple silicon Mac or a Vision Pro as an iPad app: a Mac would then hold
        # two apps with one bundle ID.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        CODE_SIGN_ENTITLEMENTS: iOS/ForeverLMiOS.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: XXXXXXXXXX
        INFOPLIST_KEY_CFBundleDisplayName: "ForeverLM"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        # The one container, as on the Mac, from iOS/Info.plist's
        # ForeverLMLibraryContainer.
        FOREVERLM_CLOUDKIT_CONTAINER: "iCloud.com.foreverlm.knowledge"
        # The CloudKit environment the entitlements sign for, from iOS/Info.plist's
        # ForeverLMCloudKitEnvironment: the phone keeps its replica apart per
        # environment, since Debug and Release share one app container.
        FOREVERLM_CLOUDKIT_ENVIRONMENT: Production
      configs:
        Debug:
          # Xcode 27 can update filesystem metadata on the source entitlements
          # while packaging a local device build and then reject that build as
          # an entitlements modification. Keep the relaxation debug-only so
          # Release/Archive signing still verifies the file strictly.
          CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          # A Debug iPhone or iPad build syncs with CloudKit's Development
          # environment (C4), with push for the sync.
          CODE_SIGN_ENTITLEMENTS: iOS/ForeverLMiOSDevelopment.entitlements
          FOREVERLM_CLOUDKIT_ENVIRONMENT: Development
        Release:
          ONLY_ACTIVE_ARCH: "NO"

