name: ForeverLM
configs:
  Debug: debug
  # The First Run app (com.foreverlm.dev.firstrun): a Debug build that opens as
  # a stranger's first launch. See FOREVERLM_FIRST_RUN below and
  # scripts/reset_first_run_app.sh. The name ends in Debug because
  # generate_secrets.sh reads that as a development configuration.
  FirstRunDebug: debug
  Release: release

options:
  bundleIdPrefix: com.foreverlm
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

  xcodeVersion: "16.2"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  # Voice mode talks to OpenAI Realtime over WebRTC, as OpenAI's guide says a
  # phone or desktop client should: the server buffers and trims the reply's
  # audio on an interruption, and the system's voice processing cancels echo.
  # Google's WebRTC, built as a binary framework for iOS and macOS.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: "157.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_OBJC_WEAK: "YES"
    # Recommended warnings (Clang)
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: "YES"
    CLANG_WARN_BOOL_CONVERSION: "YES"
    CLANG_WARN_COMMA: "YES"
    CLANG_WARN_CONSTANT_CONVERSION: "YES"
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: "YES"
    CLANG_WARN_EMPTY_BODY: "YES"
    CLANG_WARN_ENUM_CONVERSION: "YES"
    CLANG_WARN_IMPLICIT_FALLTHROUGH: "YES"
    CLANG_WARN_INFINITE_RECURSION: "YES"
    CLANG_WARN_INT_CONVERSION: "YES"
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: "YES"
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: "YES"
    CLANG_WARN_OBJC_LITERAL_CONVERSION: "YES"
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: "YES"
    CLANG_WARN_RANGE_LOOP_ANALYSIS: "YES"
    CLANG_WARN_STRICT_PROTOTYPES: "YES"
    CLANG_WARN_SUSPICIOUS_MOVE: "YES"
    CLANG_WARN_UNREACHABLE_CODE: "YES"
    CLANG_WARN__DUPLICATE_METHOD_MATCH: "YES"
    ENABLE_STRICT_OBJC_MSGSEND: "YES"
    GCC_NO_COMMON_BLOCKS: "YES"
    GCC_WARN_UNDECLARED_SELECTOR: "YES"
    GCC_WARN_UNINITIALIZED_AUTOS: "YES_AGGRESSIVE"
    GCC_WARN_UNUSED_FUNCTION: "YES"
    GCC_WARN_UNUSED_VARIABLE: "YES"
    GCC_WARN_64_TO_32_BIT_CONVERSION: "YES"
    GCC_WARN_ABOUT_RETURN_TYPE: "YES_ERROR"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: "YES"
      ENABLE_TESTABILITY: "YES"
    FirstRunDebug:
      ONLY_ACTIVE_ARCH: "YES"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

schemes:
  # macOS app
  ForeverLM (macOS):
    build:
      targets:
        ForeverLM_macOS: all
        ForeverLMMacUnitTests: [test]
        ForeverLMMacUITests: [test]
    run:
      config: Debug
      # ForeverLM does not issue Metal commands. PDFKit on macOS 27 can send a
      # zero-instance wide-line draw for otherwise readable PDFs; Xcode's Metal
      # validation layer aborts on that private-framework call before the app can
      # recover. Keep validation off for the macOS app run scheme so PDFs behave
      # under Xcode exactly as they do in production.
      enableGPUValidationMode: false
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - ForeverLM_macOS
      targets:
        - ForeverLMMacUnitTests
        - ForeverLMMacUITests

  ForeverLM (iOS):
    build:
      targets:
        ForeverLM_iOS: all
        ForeverLMiOSUITests: [test]
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - ForeverLMiOSUnitTests
        - ForeverLMiOSUITests

targets:
  # macOS app
  ForeverLM_macOS:
    type: application
    platform: macOS
    # The target is ForeverLM_macOS but the product is ForeverLM.app. Without
    # this, XcodeGen names the scheme's buildable after the target, so the
    # schemes regenerate to "ForeverLM_macOS.app" — a name nothing produces.
    productName: ForeverLM
    preBuildScripts:
      - name: Remove Stale Test Bundles
        script: |
          case "${CONFIGURATION}" in
            Debug) exit 0 ;;
          esac
          APP_PLUGINS_DIR="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/PlugIns"
          if [ -d "$APP_PLUGINS_DIR" ]; then
            find "$APP_PLUGINS_DIR" -maxdepth 1 -name "*.xctest" -exec rm -rf {} +
          fi
        basedOnDependencyAnalysis: false
      - name: Generate Secrets
        script: "\"${SRCROOT}/scripts/generate_secrets.sh\""
        basedOnDependencyAnalysis: false
      - name: Enforce AI Model Routing
        script: "/bin/sh \"${SRCROOT}/scripts/check_ai_model_routing.sh\""
        basedOnDependencyAnalysis: false
      - name: Enforce Preference Keys
        script: "/bin/sh \"${SRCROOT}/scripts/check_preference_keys.sh\""
        basedOnDependencyAnalysis: false
      - name: Enforce Lock Safety
        script: "xcrun python3 \"${SRCROOT}/scripts/check_lock_reentry.py\""
        basedOnDependencyAnalysis: false
      - name: Enforce Main Thread Never Waits
        script: "xcrun python3 \"${SRCROOT}/scripts/check_main_thread_blocking.py\""
        basedOnDependencyAnalysis: false
    sources:
      - Shared
      - MCP
      - path: App
        excludes:
          - ArtifactEditorResources
          - ChatRendererResources
          - KnowledgeMapResources
          - PublishedPageResources
          - WelcomeClipsResources
          - AppIcon.icon
      # The app icon ships as an Icon Composer bundle so macOS 26 can render the
      # dark and tinted Dock variants; actool still emits the legacy .icns from
      # it for macOS 14 and 15. XcodeGen has no file type for `.icon` and would
      # otherwise walk into the bundle and add icon.json and the layer PNGs as
      # loose resources, so it has to be pinned to a single file reference.
      - path: App/AppIcon.icon
        type: file
      - path: App/ArtifactEditorResources
        type: folder
        buildPhase: resources
      # The chat renderer Web Studio also runs, built by Web/ChatRenderer with
      # KaTeX and its fonts beside it, so chat markdown needs no CDN.
      - path: App/ChatRendererResources
        type: folder
        buildPhase: resources
      # The Map's renderer, copied from Web/KnowledgeMap (a plain script, no
      # bundling) and loaded over file:// in the Map pane's web view.
      - path: App/KnowledgeMapResources
        type: folder
        buildPhase: resources
      # The published-page renderer foreverlm.com runs, built by Web/PublishedPage
      # from docs-site/website/publishing, so the Docs pane's Page view draws a
      # doc on this Mac instead of asking the site to.
      - path: App/PublishedPageResources
        type: folder
        buildPhase: resources
      # The screen recordings beside the setup welcome's pages. A page whose
      # clip is missing shows its words alone; the folder's README is the
      # shot list.
      - path: App/WelcomeClipsResources
        type: folder
        buildPhase: resources
      # The public changelog rides in the bundle so the What's New sheet can
      # show this build's highlights after an update. ReleaseNotesChangelog
      # parses it; release_macos.sh refuses to ship a build whose section is
      # missing from it.
      - path: ../docs-site/changelog.md
        buildPhase: resources
      # Unused by the Mac app itself; compiled in so ForeverLMMacUnitTests can
      # reach platform-neutral iOS helpers through @testable import ForeverLM.
      - iOS/MobileOpenRouterChat.swift
      - iOS/MobileReaderText.swift
      - path: Shared/Utilities/Secrets.generated.swift
        optional: true
    dependencies:
      - package: ZIPFoundation
      - package: Sparkle
      - package: WebRTC
      - sdk: MediaPlayer.framework
      # Bundled auxiliary tool that mints Apple Podcasts API bearer tokens.
      # Embedded into Contents/MacOS so pathForAuxiliaryExecutable can find it.
      - target: PodcastTokenHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foreverlm
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "0.225.0"
        CURRENT_PROJECT_VERSION: "305"
        PRODUCT_NAME: "$(FOREVERLM_PRODUCT_NAME)"
        PRODUCT_MODULE_NAME: "ForeverLM"
        # Production identity. The Debug config below replaces these values so the
        # development app is a genuinely separate macOS app rather than a second build
        # of the installed one: ForeverLMRuntimeIdentity switches on FOREVERLM_DEVELOPMENT
        # to pick its own Application Support root, data folder names, Keychain vault,
        # and MCP port, and App/Info.plist reads FOREVERLM_URL_SCHEME. Without these the
        # runtime split is dead code: every Xcode build ships as com.foreverlm and opens
        # the daily-use knowledge.db, which is what let agent builds replace the app
        # the product owner was working in. The module name stays ForeverLM in both configurations
        # so @testable import ForeverLM is unaffected.
        # The app's file and executable name (`DevLM.app`, `FirstRunLM.app`). Spotlight
        # and the app pickers of other tools list an app by this name, so the two
        # development apps get short ones that typing `@for` in such a picker does not
        # reach. The data folders keep their long names (ForeverLMRuntimeIdentity's
        # productFolderName); the Mac's ForeverLMRuntimeIdentity.bundleFileName and every
        # script that installs or launches the app by path carry the same names.
        FOREVERLM_PRODUCT_NAME: "ForeverLM"
        # What the menu bar, the Dock tooltip, and notifications call the app; the Dev
        # app reads "ForeverLM (Dev)" in the menu bar.
        FOREVERLM_BUNDLE_NAME: "ForeverLM"
        FOREVERLM_URL_SCHEME: "foreverlm"
        # The one CloudKit container every build names (docs/cloudkit-schema-design.md
        # §2.1), read at run time from App/Info.plist's ForeverLMLibraryContainer. The
        # signed environment entitlement picks its replica: Development for Debug and
        # First Run, Production for Release. Every entitlements file grants exactly this
        # container, since CKContainer(identifier:) traps on one the app is not entitled to.
        FOREVERLM_CLOUDKIT_CONTAINER: "iCloud.com.foreverlm.knowledge"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ship one universal macOS app. Apple's NaturalLanguage/CoreML/Accelerate stack
        # supports both architectures; Intel uses its CPU/GPU path and is expected to be
        # slower for on-device embeddings and Whisper transcription.
        ARCHS: "$(ARCHS_STANDARD)"
        ENABLE_HARDENED_RUNTIME: "YES"
        # Sparkle ships pre-signed helper binaries; Xcode cannot strip signed artifacts during copy.
        COPY_PHASE_STRIP: "NO"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "ForeverLM uses speech recognition for voice answers in Review Chat."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ForeverLM uses the microphone for dictation."
        # The Mac target ships App/Info.plist as is (GENERATE_INFOPLIST_FILE is
        # NO below), so usage descriptions belong in that file, not here: the
        # Mac's Calendar read and write (`AppleCalendarService`) is declared there
        # as NSCalendarsFullAccessUsageDescription. An INFOPLIST_KEY_* line in this
        # block never reaches the bundle.
        INFOPLIST_KEY_CFBundleDisplayName: "$(FOREVERLM_BUNDLE_NAME)"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"
        SWIFT_OBJC_BRIDGING_HEADER: Shared/BridgingHeader.h
      configs:
        # The Mac app always ships as a notarized DMG and updates through Sparkle, so it
        # needs only the standard Debug and Release configurations. Debug uses the combined
        # development profile (iCloud + native Sign in with Apple); the release script turns
        # the Release archive into the separately provisioned Developer ID app.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG DIRECT_DOWNLOAD FOREVERLM_DEVELOPMENT"
          PRODUCT_BUNDLE_IDENTIFIER: com.foreverlm.dev
          FOREVERLM_PRODUCT_NAME: "DevLM"
          FOREVERLM_BUNDLE_NAME: "ForeverLM (Dev)"
          FOREVERLM_URL_SCHEME: "foreverlm-dev"
          CODE_SIGN_ENTITLEMENTS: App/ForeverLMDevelopment.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: XXXXXXXXXX
          PROVISIONING_PROFILE_SPECIFIER: ""
          ONLY_ACTIVE_ARCH: "YES"
        # A third app beside the installed one and the Dev app, with its own
        # bundle, library, settings, keychain, permissions and Dock badge, so a
        # first launch can be walked through without touching the seeded Dev
        # library. Built, installed and reset by `scripts/build_dev.sh --first-run`.
        FirstRunDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG DIRECT_DOWNLOAD FOREVERLM_DEVELOPMENT FOREVERLM_FIRST_RUN"
          PRODUCT_BUNDLE_IDENTIFIER: com.foreverlm.dev.firstrun
          FOREVERLM_PRODUCT_NAME: "FirstRunLM"
          FOREVERLM_BUNDLE_NAME: "ForeverLM (First Run)"
          FOREVERLM_URL_SCHEME: "foreverlm-firstrun"
          CODE_SIGN_ENTITLEMENTS: App/ForeverLMFirstRun.entitlements
          # Signed manually: Xcode's automatic signing cannot mint a profile
          # with any App Store Connect key here ("Authentication failed"), and
          # nothing it managed ever existed for this bundle ID. The profile was
          # made through POST /v1/profiles for both Macs and must sit in
          # ~/Library/Developer/Xcode/UserData/Provisioning Profiles.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: XXXXXXXXXX
          PROVISIONING_PROFILE_SPECIFIER: "ForeverLM First Run Mac Development"
          ONLY_ACTIVE_ARCH: "YES"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DIRECT_DOWNLOAD
          CODE_SIGN_ENTITLEMENTS: App/ForeverLMDirectDownload.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: XXXXXXXXXX
          PROVISIONING_PROFILE_SPECIFIER: ""
          ONLY_ACTIVE_ARCH: "NO"

  ForeverLM_iOS:
    type: application
    platform: iOS
    # Same as the Mac target: product is ForeverLM.app, target is ForeverLM_iOS.
    productName: ForeverLM
    preBuildScripts:
      - name: Enforce AI Model Routing
        script: "/bin/sh \"${SRCROOT}/scripts/check_ai_model_routing.sh\""
        basedOnDependencyAnalysis: false
      - name: Enforce Preference Keys
        script: "/bin/sh \"${SRCROOT}/scripts/check_preference_keys.sh\""
        basedOnDependencyAnalysis: false
      - name: Enforce Lock Safety
        script: "xcrun python3 \"${SRCROOT}/scripts/check_lock_reentry.py\""
        basedOnDependencyAnalysis: false
      - name: Enforce Main Thread Never Waits
        script: "xcrun python3 \"${SRCROOT}/scripts/check_main_thread_blocking.py\""
        basedOnDependencyAnalysis: false
    sources:
      # Every preference key, declared once for both platforms (`Prefs`), and the typed access to them.
      - Shared/Preferences
      # The app's lock (every Shared file that guards state uses it).
      - Shared/Utilities/AppLock.swift
      - iOS/ForeverLMMobileApp.swift
      - iOS/MobileDesign.swift
      - iOS/MobileKeychainService.swift
      - iOS/MobileAudioReviewView.swift
      - iOS/MobileAudioReviewViewModel.swift
      - iOS/MobileAsyncAlert.swift
      - iOS/MobileAudioPlaybackTypes.swift
      - iOS/MobileAudioReviewViewModel+Catalog.swift
      - iOS/MobileAudioReviewViewModel+Library.swift
      - iOS/MobileAudioReviewViewModel+Narration.swift
      - iOS/MobileAudioReviewViewModel+Playback.swift
      - iOS/MobileAudioReviewViewModel+SourceActivity.swift
      - iOS/MobileAudioReviewViewModel+TextToSpeech.swift
      - iOS/MobileAudioReviewViewModel+Voice.swift
      - iOS/MobileAutomaticAudioConstraintMatcher.swift
      - iOS/MobileCloudSourceCatalog.swift
      - iOS/MobileCloudSourceTextStore.swift
      - iOS/MobileTextToSpeechTypes.swift
      - iOS/MobileCloudSourceModels.swift
      # Notebooks on the phone (docs/notebooks-design.md, "iPhone"): Home, a
      # notebook's Sources · Chat · Studio, and the rules they share with the
      # Mac — the chat checkboxes' row, whole-source grounding, Home's order,
      # the last notebook, links, Docs — kept Foundation-only for the Mac
      # unit tests.
      - iOS/MobileNotebookModels.swift
      # Which context notebooks a notebook's chats read, and how a box
      # changes the two rows: the Mac's own rule (`NotebookChatContext`).
      - Shared/Models/NotebookChatContext.swift
      # Sharing a notebook asks once whether the learner may share its
      # sources: the synced row, its words and its version, the Mac's own
      # (`SharingRightsAffirmation`); and its Share says what it gives in the
      # Mac's words (`NotebookShareLine`).
      - Shared/Models/SharingRightsAffirmation.swift
      - Shared/Models/NotebookShareLine.swift
      - iOS/MobileNotebookHomeView.swift
      # Home's screen, drawn from what it is handed, and its DEBUG harness
      # (`-foreverlm-uitest-home`).
      - iOS/MobileHomeDashboard.swift
      - iOS/MobileHomeHarness.swift
      # The whole app over a sample library, DEBUG only (`-foreverlm-uitest-app`).
      - iOS/MobileAppHarness.swift
      # Home's To Read: what was saved and is still waiting, newest saved
      # first, by the rule the Mac's Library scope shares (`ToReadList`).
      - Shared/Models/ToReadList.swift
      - iOS/MobileToReadScreen.swift
      # Home's Follow up: the passages set aside to follow up or doubt,
      # newest first, by the rule the Mac's Library scope shares (`FollowUpList`).
      - Shared/Models/FollowUpList.swift
      - iOS/MobileFollowUpScreen.swift
      # The Mac's rail and Notebooks home rules (`NotebookRail`,
      # `NotebookPins`, `NotebooksHomeSort`, the filter, Grid | List), which
      # Home's Pinned, Recent and Collections and the Notebooks screen read.
      - Shared/Models/NotebooksHomeRules.swift
      - iOS/MobileNotebookRail.swift
      # The Notebooks screen Home's rail rows push (Grid | List, the sort, the
      # filter) and the notebook and collection menus both screens carry.
      - iOS/MobileNotebooksScreen.swift
      - iOS/MobileNotebookMenus.swift
      # Home's collections of notebooks: the Mac's two kinds of synced row
      # (`NotebookCollections`), found through the notebooks the phone knows.
      - iOS/MobileNotebookCollectionsStore.swift
      - iOS/MobileNotebookScreen.swift
      # The way to the learner's Mac through the gateway (Route A), which the
      # phone's search asks, and generation 1's rules for a notebook's Share,
      # dormant until WP30 (a notebook is shared by moving it into a space).
      - iOS/MobileNotebookSharing.swift
      - iOS/MobileNotebookChatTab.swift
      - iOS/MobileNotebookStudioTab.swift
      # The iPad's notebook as the Mac's three columns, each side folding to
      # a strip, and Home's gallery: the view, and its Foundation-only rules.
      - iOS/MobileNotebookColumns.swift
      - iOS/MobileNotebookColumnLayout.swift
      # The Space on the phone (docs/docs-design.md, "The Space"): every page, the learner's spaces of
      # pages, pins and subpages, read from the replica and written through the generation-2 writer
      # (`MobileSpaceStore`, `MobileSpaceRecords`); its rules Foundation-only for the Mac unit tests, over
      # the Mac's own rows (`PageSpaces`, `PagePins`, `PageParents`) and daily notes (`DailyNote`).
      - iOS/MobileSpaceModels.swift
      - iOS/MobileSpaceStore.swift
      # Its screens: the sidebar's places, a place's pages and the split view on a roomy screen; the
      # page row menu and its questions; a page written in the editor with its autosave; and the DEBUG
      # `-foreverlm-uitest-space` harness over a sample library made in memory.
      - iOS/MobileSpaceViews.swift
      - iOS/MobileSpaceMenus.swift
      - iOS/MobilePageScreen.swift
      - iOS/MobileSpaceHarness.swift
      # Space › Plan: the quarters of a year, each opening its plan Page.
      - iOS/MobilePlanList.swift
      - Shared/Models/PageSpaces.swift
      - Shared/Models/DocGraph.swift
      # The quarter's plan (`PlanQuarter`): the Mac's ids, titles and template, so a plan made on
      # the phone is the same record as one made on a Mac.
      - Shared/Models/PlanQuarter.swift
      # Add sources on the phone: up to ten pasted links, and pages from the
      # document camera or Photos filed as one PDF that carries the words
      # Vision read on them, so the Mac's paper ingestion and every chat can
      # read a scan. The links' and the pages' rules are Foundation-only for
      # the Mac unit tests.
      - iOS/MobileNotebookAddSourcesModels.swift
      - iOS/MobileScannedPagesPDF.swift
      - iOS/MobileNotebookCapture.swift
      - iOS/MobileCloudMutations.swift
      # Retry for the transient CloudKit failures every direct phone call hits.
      - iOS/MobileCloudKitRetry.swift
      - iOS/MobileLibraryManagementViews.swift
      - iOS/MobileWidgetSnapshot.swift
      - iOS/MobileShareInbox.swift
      # The share sheet's notebooks, its preview and the adds a drain of the
      # inbox makes; Foundation only, compiled by the share extension too.
      - iOS/MobileShareSheetModels.swift
      - iOS/MobileShareDrain.swift
      - iOS/MobileReviewSpeechService.swift
      - iOS/MobileOpenRouterChat.swift
      - iOS/MobileSourceChatService.swift
      - iOS/DrivingSourceAnswerPlanner.swift
      - iOS/MobileDrivingBenchmarks.swift
      - iOS/MobileVoiceSourceResolver.swift
      - iOS/MobileVoiceAgentService.swift
      - iOS/MobileVoiceCommandService.swift
      - iOS/MobileSourceVoiceFormatter.swift
      - iOS/MobileSiriIntents.swift
      - iOS/MobileSourceAppEntity.swift
      - iOS/MobileSemanticSourceSearch.swift
      - iOS/CarPlaySceneDelegate.swift
      - iOS/MobileReviewBrain.swift
      - iOS/MobileVoiceReviewPromptContract.swift
      - iOS/MobileReviewFoundationBrain.swift
      - iOS/MobileReviewSessionRecorder.swift
      - iOS/MobileMemoryAttemptRecorder.swift
      # Voice mode on a source: OpenAI Realtime speech to speech over WebRTC, on
      # ForeverLM's own OpenAI credits (back 2026-11-07). The call, the
      # conversation and its tutor prompt are shared with the Mac; the phone
      # brings its audio session and its entry points.
      - Shared/Services/AI/RealtimeVoiceProtocol.swift
      - Shared/Services/AI/RealtimeVoiceSession.swift
      - Shared/Services/AI/RealtimeVoiceTutor.swift
      - Shared/Services/AI/RealtimeVoiceController.swift
      - Shared/Services/AI/ManagedAI+RealtimeVoice.swift
      - Shared/Views/RealtimeVoicePresentation.swift
      - iOS/MobileRealtimeVoice.swift
      # The voice assistant (CarPlay, Home's waveform): the shared prompt and
      # library helpers, and the phone's picture of the learner and its tools.
      - Shared/Services/AI/RealtimeVoiceAssistant.swift
      - iOS/MobileRealtimeAssistant.swift
      # Review by Voice: today's cards asked and graded on the same realtime
      # conversation.
      - Shared/Services/AI/RealtimeVoiceCardReview.swift
      - iOS/MobileRealtimeCardReview.swift
      - Shared/Services/AI/RealtimeVoiceCardsToCheck.swift
      - iOS/MobileRealtimeCardsToCheck.swift
      # Memory Check by Voice: the cards, then today's memory review, graded
      # through the typed review's grading.
      - Shared/Services/AI/RealtimeVoiceMemoryCheck.swift
      - iOS/MobileRealtimeMemoryCheck.swift
      # Speech loudness: shared gain+limiter stages, and the AVPlayer tap that
      # applies them to text-to-speech narration.
      - iOS/MobileSpeechLoudness.swift
      - iOS/MobileLoudnessAudioMix.swift
      # Old realtime rows' cached-charge reconstruction for usage history,
      # and the cost formatting; Foundation-only for the Mac unit tests.
      - iOS/MobileRealtimeRates.swift
      - iOS/MobileSourceFileStore.swift
      # Durable, non-purgeable copies of saved sources + the Save Offline UI.
      - iOS/MobileOfflineLibrary.swift
      - iOS/MobileOfflineViews.swift
      - iOS/MobileModelPreferenceStore.swift
      - iOS/MobileModelPreferenceStore+Typed.swift
      - iOS/MobileSourcePDFView.swift
      - iOS/MobilePaperFigureView.swift
      # XCUITest self-check line (DEBUG-only; launch-argument gated).
      - iOS/MobileUITestProbe.swift
      # Read-and-chat surface behind Settings: browser, reader, chat, dictation.
      - iOS/MobileSignInGate.swift
      - iOS/MobileAudioSessionArbiter.swift
      - iOS/MobileSettingsView.swift
      - iOS/MobileSourceBrowserView.swift
      # A course's page and its quizzes: the Mac's path and gate
      # (docs/courses-design.md) over the shared course types.
      - iOS/MobileCoursePath.swift
      - iOS/MobileCourseViews.swift
      - Shared/Models/CourseCore.swift
      - iOS/MobileReaderText.swift
      - iOS/MobileReaderWebView.swift
      # A page read and written in the editor the Mac and the web run (its
      # bundle is the resource folder below), fitted to a finger, with the
      # DEBUG `-foreverlm-uitest-page-editor` harness.
      - iOS/MobilePageEditorView.swift
      # A book read whole: the chapters on the page, what the page reports,
      # and the steps that keep it up to date.
      - iOS/MobileBookReading.swift
      # Find inside a source: the bar, its state, and the PDF/web performers.
      - iOS/MobileReaderFind.swift
      - iOS/MobileSourceReaderView.swift
      - iOS/MobileSourceReaderViewModel.swift
      # Explainers on the phone: the writer, the row badge, menu item and
      # reader control, and the shared grammar/lengths/writer turn.
      - iOS/MobileExplainerGenerator.swift
      - iOS/MobileExplainerViews.swift
