      - iOS/MobileVoiceReviewPromptContract.swift
      - iOS/MobileRealtimeRates.swift
      - iOS/MobileSpeechLoudness.swift
      # The shared sync vectors (docs/cloudkit-schema-design.md §12.1), as one
      # folder in the bundle: SyncVectorRunner reads them from `vectors/`.
      - path: ../schema/vectors
        type: folder
        buildPhase: resources
    resources:
      - path: UnitTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: ForeverLM_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foreverlm.mac-unittests
        PRODUCT_NAME: ForeverLMMacUnitTests
        PRODUCT_MODULE_NAME: ForeverLMMacUnitTests
        GENERATE_INFOPLIST_FILE: "YES"
        # Follows the host app's per-configuration name: under Debug the host is
        # "DevLM.app". A hardcoded ForeverLM.app here would fail to launch the
        # test host in the only configuration these tests are ever run in.
        FOREVERLM_PRODUCT_NAME: "ForeverLM"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/$(FOREVERLM_PRODUCT_NAME).app/Contents/MacOS/$(FOREVERLM_PRODUCT_NAME)"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          FOREVERLM_PRODUCT_NAME: "DevLM"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: XXXXXXXXXX

