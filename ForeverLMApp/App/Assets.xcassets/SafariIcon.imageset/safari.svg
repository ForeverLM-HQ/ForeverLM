<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AC8FA"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <!-- Tick marks around compass -->
  <g stroke="#fff" stroke-width="1.2" opacity="0.7">
    <!-- N -->
    <line x1="32" y1="5" x2="32" y2="9"/>
    <!-- NE -->
    <line x1="50.09" y1="13.91" x2="47.27" y2="16.73"/>
    <!-- E -->
    <line x1="59" y1="32" x2="55" y2="32"/>
    <!-- SE -->
    <line x1="50.09" y1="50.09" x2="47.27" y2="47.27"/>
    <!-- S -->
    <line x1="32" y1="59" x2="32" y2="55"/>
    <!-- SW -->
    <line x1="13.91" y1="50.09" x2="16.73" y2="47.27"/>
    <!-- W -->
    <line x1="5" y1="32" x2="9" y2="32"/>
    <!-- NW -->
    <line x1="13.91" y1="13.91" x2="16.73" y2="16.73"/>
  </g>
  <!-- Compass needle - red/white diamond -->
  <!-- Red half (top-right pointing) -->
  <polygon points="32,32 43,21 36,38" fill="#FF3B30"/>
  <polygon points="32,32 43,21 26,28" fill="#E8352B"/>
  <!-- White half (bottom-left pointing) -->
  <polygon points="32,32 21,43 28,26" fill="#FFFFFF"/>
  <polygon points="32,32 21,43 38,36" fill="#E8E8E8"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2" fill="#fff"/>
</svg>
